name: CI

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Gradle test selector (e.g. --tests com.github.junrar.FooTest); empty runs the full suite'
        required: false
        default: ''

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        java: [ 8, 11, 17, 18 ]
    name: Test JDK ${{ matrix.java }}
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          java-package: 'jdk'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Enable test result logging
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/seal-test-logging.gradle <<'GRADLE'
          allprojects {
              tasks.withType(Test).configureEach {
                  testLogging {
                      events 'passed', 'skipped', 'failed'
                      exceptionFormat 'full'
                  }
                  def skippedTests = []
                  afterTest { desc, result ->
                      if (result.resultType == TestResult.ResultType.SKIPPED) {
                          skippedTests << "${desc.className} > ${desc.name}"
                      }
                  }
                  afterSuite { desc, result ->
                      if (desc.parent == null) {
                          skippedTests.each { println "SKIPPED: ${it}" }
                          println "TEST SUMMARY (${path}): ${result.testCount} tests, ${result.successfulTestCount} passed, ${result.failedTestCount} failed, ${result.skippedTestCount} skipped -> ${result.resultType}"
                      }
                  }
              }
          }
          GRADLE
      - name: Build
        uses: gradle/gradle-build-action@v2
        with:
          arguments: ${{ inputs.test-filter != '' && format('assemble jar test {0}', inputs.test-filter) || 'build jar -x checkstyleMain -x checkstyleTest -x checkstyleRegressionTest' }}
      - name: Upload jar
        if: matrix.java == '8'
        uses: actions/upload-artifact@v4
        with:
          name: junrar-jar
          path: |
            build/libs/junrar-*.jar
            !build/libs/*-sources.jar
            !build/libs/*-javadoc.jar
          if-no-files-found: error
      - name: Jacoco
        uses: gradle/gradle-build-action@v2
        with:
          arguments: jacocoTestReport

  release:
    name: semantic release
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 30
    if: false
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v2
        with:
          node-version: '16'
          cache: 'npm'
      - uses: actions/setup-java@v2
        with:
          java-version: '8'
          java-package: 'jdk'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Install dependencies
        run: npm ci --omit=dev --ignore-scripts
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.GPG_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.GPG_PASSPHRASE }}
          ORG_GRADLE_PROJECT_sonatypeUsername: ${{ secrets.MAVENCENTRAL_USER }}
          ORG_GRADLE_PROJECT_sonatypePassword: ${{ secrets.MAVENCENTRAL_PASSWORD }}
        run: npx semantic-release
